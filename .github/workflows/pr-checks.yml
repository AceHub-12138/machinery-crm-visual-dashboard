name: Screen PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
  browser:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - name: Record macOS system and application fonts
        run: node .github/workflows/macos-runtime.mjs
      - run: pnpm exec playwright test --config=.github/workflows/browser.config.ts
      - name: Verify JSON report is in the artifact directory
        if: always()
        run: |
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const file = path.join(process.env.GITHUB_WORKSPACE, "test-results/ci-results.json"); const report = JSON.parse(fs.readFileSync(file, "utf8")); console.log(JSON.stringify({ report: path.relative(process.env.GITHUB_WORKSPACE, file), stats: report.stats }));'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-browser-results
          path: ${{ github.workspace }}/test-results/
          if-no-files-found: error
          retention-days: 7
