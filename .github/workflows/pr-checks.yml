name: Screen PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install and lock Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          mkdir -p "$HOME/.config/fontconfig/conf.d"
          cp .github/workflows/noto-cjk.conf "$HOME/.config/fontconfig/conf.d/99-nexus-cjk.conf"
          fc-cache -f
          for family in 'PingFang SC' 'Microsoft YaHei' 'Noto Sans SC' 'sans-serif'; do
            fc-match -f '%{family} | %{style} | weight=%{weight} | %{file}\n' "$family:lang=zh-cn:weight=180"
          done
      - name: Verify browser Chinese font and weight
        run: node .github/workflows/font-probe.cjs
      - run: pnpm exec playwright test --config=.github/workflows/browser.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-browser-results
          path: test-results/
          retention-days: 7
